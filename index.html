<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة كرة القدم - هدايا تيك توك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0d1f0f;
    font-family: 'Cairo', 'Tajawal', sans-serif;
  }

  /* ── MAIN LAYOUT: panel LEFT, pitch RIGHT ── */
  #layout {
    display: flex;
    flex-direction: row;
    width: 1920px; height: 1080px;
  }

  /* ══════════════════════════════════
     LEFT PANEL — gift legend
  ══════════════════════════════════ */
  #gift-panel {
    width: 245px; min-width: 245px; height: 1080px;
    background: linear-gradient(180deg, #060f07 0%, #0d1f0f 40%, #060f07 100%);
    border-right: 2px solid rgba(255,215,0,0.18);
    display: flex; flex-direction: column;
    padding: 14px 0 10px 0; z-index: 10;
    box-shadow: 6px 0 28px rgba(0,0,0,0.7);
  }
  #gift-panel .panel-title {
    font-family: 'Cairo', sans-serif;
    font-size: 15px; font-weight: 900;
    color: #FFD700; text-align: center;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,215,0,0.2);
    margin: 0 10px 6px 10px;
    line-height: 1.4;
  }
  .gift-row {
    display: flex; flex-direction: row;
    align-items: center; gap: 7px;
    padding: 4px 10px; border-radius: 7px;
    margin: 2px 6px;
  }
  .gift-flag  { font-size: 21px; line-height:1; flex-shrink:0; }
  .gift-info  { flex:1; min-width:0; }
  .gift-country {
    font-family: 'Cairo', sans-serif;
    font-size: 13px; font-weight: 900;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl;
  }
  .gift-name  {
    font-size: 11px; color: rgba(255,255,255,0.55);
    white-space: nowrap; direction: ltr;
    display: flex; align-items: center; gap: 5px;
  }
  .gift-img {
    width: 36px; height: 36px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
  }
  .gift-coins {
    font-size: 10px;
    color: #FFD700;
    font-weight: 900;
    white-space: nowrap;
  }

  /* ══════════════════════════════════
     PITCH AREA
  ══════════════════════════════════ */
  #pitch-area {
    flex: 1; position: relative; height: 1080px; overflow: hidden;
  }

  /* Grass stripes */
  #pitch-area::before {
    content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      #2c7a3a 0px, #2c7a3a 54px,
      #256030 54px, #256030 108px
    );
  }

  /* ── Field lines ── */
  .fline { position:absolute; background:rgba(255,255,255,0.22); z-index:1; }
  .fl-top    { top:28px;    left:38px; right:38px; height:2px; }
  .fl-bottom { bottom:28px; left:38px; right:38px; height:2px; }
  .fl-left   { top:28px; bottom:28px; left:38px;  width:2px; }
  .fl-right  { top:28px; bottom:28px; right:38px; width:2px; }
  .fl-mid    { top:28px; bottom:28px; left:50%; width:2px; transform:translateX(-50%); }
  .circle-mid {
    position:absolute; left:50%; top:50%;
    width:110px; height:110px;
    border:2px solid rgba(255,255,255,0.18); border-radius:50%;
    transform:translate(-50%,-50%); z-index:1;
  }
  /* Penalty box RIGHT (goal side) */
  .pbox-right {
    position:absolute; right:38px; top:50%;
    width:120px; height:320px;
    border:2px solid rgba(255,255,255,0.15);
    transform:translateY(-50%); z-index:1;
    border-right:none;
  }
  /* Penalty box LEFT (start side) */
  .pbox-left {
    position:absolute; left:38px; top:50%;
    width:120px; height:320px;
    border:2px solid rgba(255,255,255,0.15);
    transform:translateY(-50%); z-index:1;
    border-left:none;
  }

  /* ── Goals ── */
  .goal {
    position:absolute; top:50%; transform:translateY(-50%);
    width:50px; height:200px; z-index:3;
    border:3px solid rgba(255,255,255,0.55);
    background:rgba(255,255,255,0.04);
  }
  .goal::after {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.13) 1px, transparent 1px);
    background-size:12px 12px;
  }
  /* Goal on RIGHT = destination */
  .goal-right { right:0px; border-right:none;height: 1000px; }
  /* Goal on LEFT = start side (just decorative) */
  .goal-left  { left:0px;  border-left:none; display: none;}

  /* Goal label */
  .goal-label {
    position:absolute; top:50%; transform:translateY(-50%);
    font-family:'Cairo',sans-serif; font-size:12px; font-weight:900;
    color:rgba(255,255,255,0.3); writing-mode:vertical-rl; z-index:4;
  }
  .goal-label.right { right:6px; }
  .goal-label.left  { left:6px; transform:translateY(-50%) rotate(180deg); }

  /* ── LANES ── */
  #lanes {
    position:absolute;
    top:28px; bottom:28px;
    left:38px; right:38px;
    display:flex; flex-direction:column;
    z-index:2;
  }
  .lane {
    flex:1; position:relative;
    border-bottom:1px solid rgba(255,255,255,0.06);
    display:flex; align-items:center;
    overflow:hidden;
  }
  .lane:last-child { border-bottom:none; }

  /* ── Flag pole at LEFT START ── */
  .lane-start-flag {
    position:absolute; left:2px; top:50%;
    transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center;
    z-index:8; pointer-events:none;
  }
  .lane-start-flag .sflag {
    font-size:24px; line-height:1;
    animation:flagWave 1.1s ease-in-out infinite alternate;
    transform-origin:bottom center;
  }
  .lane-start-flag .spole {
    width:2px; height:20px;
    background:rgba(255,255,255,0.4); border-radius:1px;
  }
  @keyframes flagWave {
    from { transform:rotate(-10deg); }
    to   { transform:rotate(10deg) scale(1.05); }
  }

  /* ── Country watermarks along lane ── */
  .lane-markers {
    position:absolute; inset:0;
    pointer-events:none; overflow:hidden;
  }
  .lane-marker {
    position:absolute; top:50%; transform:translateY(-50%);
    font-family:'Cairo',sans-serif; font-size:11px; font-weight:700;
    color:rgba(255,255,255,0.09); white-space:nowrap;
    display:flex; align-items:center; gap:3px; direction:rtl;
  }

  /* ── Progress bar (grows left → right) ── */
  .lane-bar {
    position:absolute; bottom:3px; left:0; right:0; height:4px;
    background:rgba(0,0,0,0.35); border-radius:2px; overflow:hidden;
  }
  .lane-bar-fill {
    height:100%; width:0%; border-radius:2px;
    transition:width 0.5s cubic-bezier(0.22,1,0.36,1);
  }

  /* ── PLAYER — faces RIGHT, moves LEFT→RIGHT ── */
  .player-wrap {
    position:absolute;
    left:0;           /* JS animates this */
    top:50%;
    transform:translateY(-50%);
    transition:left 0.5s cubic-bezier(0.22,1,0.36,1);
    z-index:6; pointer-events:none;
  }
  .player-svg { width:36px; height:60px; display:block; filter:drop-shadow(0 3px 7px rgba(0,0,0,0.75)); }

  /* Limb run animations */
  .player-wrap .leg-l { animation:legL 0.30s ease-in-out infinite alternate; transform-origin:18px 36px; }
  .player-wrap .leg-r { animation:legR 0.30s ease-in-out infinite alternate; transform-origin:18px 36px; }
  .player-wrap .arm-l { animation:armL 0.30s ease-in-out infinite alternate; transform-origin:13px 23px; }
  .player-wrap .arm-r { animation:armR 0.30s ease-in-out infinite alternate; transform-origin:23px 23px; }
  @keyframes legL { from{transform:rotate(-22deg)} to{transform:rotate(22deg)} }
  @keyframes legR { from{transform:rotate(22deg)}  to{transform:rotate(-22deg)} }
  @keyframes armL { from{transform:rotate(-18deg)} to{transform:rotate(18deg)} }
  @keyframes armR { from{transform:rotate(18deg)}  to{transform:rotate(-18deg)} }

  /* Flag above player */
  .player-flag {
    position:absolute; top:-17px; left:50%;
    transform:translateX(-50%);
    font-size:15px; line-height:1;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.9));
    animation:pflag 0.9s ease-in-out infinite alternate;
  }
  @keyframes pflag {
    from { transform:translateX(-50%) rotate(-8deg); }
    to   { transform:translateX(-50%) rotate(8deg); }
  }

  /* ── Ball (rolls ahead of player) ── */
  .ball-wrap {
    position:absolute; left:0;
    top:50%; transform:translateY(-50%);
    transition:left 0.5s cubic-bezier(0.22,1,0.36,1);
    z-index:5; pointer-events:none;
  }
  .ball-svg { width:18px; height:18px; animation:ballSpin 0.35s linear infinite; }
  @keyframes ballSpin { to{transform:rotate(360deg);} }

  /* ══════════════════════════════════
     HEADER
  ══════════════════════════════════ */
  #header {
    position:fixed; top:0; left:245px; right:0; height:28px;
    background:linear-gradient(90deg,#060f07,#0d260f,#060f07);
    border-bottom:1px solid rgba(255,215,0,0.15);
    display:flex; align-items:center; justify-content:center; gap:44px;
    z-index:30;
  }
  #header .htitle {
    font-family:'Cairo',sans-serif; font-size:15px; font-weight:900;
    color:#FFD700; letter-spacing:1px;
  }
  #header .hstat { font-size:12px; color:rgba(255,255,255,0.5); }
  #header .hstat span { color:#fff; font-weight:900; }

  /* ══════════════════════════════════
     GOAL FLASH
  ══════════════════════════════════ */
  #goal-flash {
    position:fixed; inset:0;
    background:radial-gradient(circle at 90% 50%, rgba(255,215,0,0.7) 0%, rgba(255,100,0,0.25) 55%, transparent 100%);
    pointer-events:none; opacity:0; z-index:50; transition:opacity 0.12s;
  }
  #goal-flash.on { opacity:1; }

  /* ══════════════════════════════════
     TOASTS
  ══════════════════════════════════ */
  #toasts {
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column-reverse; gap:8px;
    align-items:center; z-index:60; pointer-events:none;
  }
  .toast {
    background:rgba(0,0,0,0.88); color:#fff;
    border-left:5px solid #FFD700;
    padding:9px 22px; border-radius:8px;
    font-family:'Cairo',sans-serif; font-size:17px; font-weight:700;
    white-space:nowrap; direction:rtl;
    animation:tIn 0.28s ease, tOut 0.3s ease 2.5s forwards;
  }
  @keyframes tIn  { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  @keyframes tOut { to{opacity:0} }

  /* ══════════════════════════════════
     WINNER OVERLAY
  ══════════════════════════════════ */
  #winner {
    position:fixed; inset:0; background:rgba(0,0,0,0.93);
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:100; direction:rtl; animation:fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  #winner.show { display:flex; }
  .w-trophy { font-size:90px; animation:tSpin 0.7s ease infinite alternate; }
  @keyframes tSpin { from{transform:scale(1) rotate(-6deg)} to{transform:scale(1.12) rotate(6deg)} }
  .w-flag  { font-size:78px; margin:8px 0; }
  .w-name  {
    font-family:'Cairo',sans-serif; font-size:74px; font-weight:900;
    color:#FFD700; text-shadow:0 0 50px rgba(255,215,0,0.85);
  }
  .w-sub   { font-family:'Cairo',sans-serif; font-size:24px; color:rgba(255,255,255,0.6); margin-top:6px; }
  .w-btn   {
    margin-top:34px; padding:14px 54px;
    font-family:'Cairo',sans-serif; font-size:24px; font-weight:900;
    background:#FFD700; color:#000; border:none; border-radius:50px;
    cursor:pointer; box-shadow:0 8px 30px rgba(255,215,0,0.4);
    transition:transform 0.15s;
  }
  .w-btn:hover { transform:scale(1.06); }

  /* ══════════════════════════════════
     CONFETTI
  ══════════════════════════════════ */
  .conf {
    position:fixed; width:11px; height:11px; top:-20px;
    border-radius:2px; animation:confFall linear forwards; z-index:90;
  }
  @keyframes confFall { to{transform:translateY(1150px) rotate(800deg);opacity:0;} }
</style>
</head>
<body>
<div id="layout">

  <!-- ══ LEFT PANEL ══ -->
  <div id="gift-panel">
    <div class="panel-title">🎁 أرسل هدية<br>لتحريك فريقك</div>
    <div id="gift-list"></div>
  </div>

  <!-- ══ PITCH ══ -->
  <div id="pitch-area">
    <!-- Field lines -->
    <div class="fline fl-top"></div>
    <div class="fline fl-bottom"></div>
    <div class="fline fl-left"></div>
    <div class="fline fl-right"></div>
    <div class="fline fl-mid"></div>
    <div class="circle-mid"></div>
    <div class="pbox-right"></div>
    <div class="pbox-left"></div>

    <!-- Goals -->
    <div class="goal goal-left"></div>
    <div class="goal goal-right"></div>
    <div class="goal-label right">🥅 المرمى</div>

    <!-- Lanes -->
    <div id="lanes"></div>
  </div>

</div>

<!-- Header -->
<div id="header">
  <div class="htitle">⚽ كرة القدم بالهدايا — تيك توك لايف ⚽</div>
  <div class="hstat">🎁 الهدايا: <span id="h-gifts">0</span></div>
  <div class="hstat">🏆 الجولة: <span id="h-round">1</span></div>
</div>

<div id="goal-flash"></div>
<div id="toasts"></div>

<!-- Winner -->
<div id="winner">
  <div class="w-trophy">🏆</div>
  <div class="w-flag" id="w-flag"></div>
  <div class="w-name" id="w-name"></div>
  <div class="w-sub">سجّل الهدف الفائز! 🎉</div>
  <button class="w-btn" onclick="newRound()">▶ جولة جديدة</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════
const CONFIG = {
  baseStep: 60,   // pixels per gift

  teams: [
    { name:"مصر",        flag:"EG", kitTop:"#CE1126", kitShorts:"#FFFFFF", skin:"#C68642" },
    { name:"العراق",     flag:"IQ", kitTop:"#007A3D", kitShorts:"#000000", skin:"#C68642" },
    { name:"السعودية",   flag:"SA", kitTop:"#165C2E", kitShorts:"#FFFFFF", skin:"#8D5524" },
    { name:"الجزائر",    flag:"DZ", kitTop:"#006233", kitShorts:"#FFFFFF", skin:"#C68642" },
    { name:"المغرب",     flag:"MA", kitTop:"#C1272D", kitShorts:"#006233", skin:"#8D5524" },
    { name:"الإمارات",   flag:"AE", kitTop:"#00732F", kitShorts:"#FFFFFF", skin:"#C68642" },
    { name:"تونس",       flag:"TN", kitTop:"#E70013", kitShorts:"#FFFFFF", skin:"#C68642" },
    { name:"الأردن",     flag:"JO", kitTop:"#007A3D", kitShorts:"#000000", skin:"#8D5524" },
    { name:"الكويت",     flag:"KW", kitTop:"#007A3D", kitShorts:"#FFFFFF", skin:"#C68642" },
    { name:"لبنان",      flag:"LB", kitTop:"#EE161F", kitShorts:"#FFFFFF", skin:"#C68642" },
  ],

  // Gift name (exact TikTok name) → country
  // All gifts below are universal — available to everyone on TikTok LIVE
  giftMap: {
    "Rose":           "مصر",       // 1 coin
    "GG":             "العراق",    // 1 coin
    "Heart Me":       "السعودية",  // 1 coin
    "TikTok":         "الجزائر",   // 1 coin
    "Finger Heart":   "المغرب",    // 5 coins
    "Ice Cream Cone": "الإمارات",  // 1 coin
    "Thumbs Up":      "تونس",      // 1 coin
    "Heart":          "الأردن",    // 1 coin
    "Confetti":       "الكويت",    // 100 coins
    "Cake Slice":     "لبنان",     // 1 coin
  },

  // Real TikTok CDN image URLs (official, public, used on TikTok LIVE)
  giftImages: {
    "Rose":           "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/eba3a9bb85c33e017f3648eaf88d7189~tplv-obj.webp",
    "GG":             "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/3f02fa9594bd1495ff4e8aa5ae265eef~tplv-obj.webp",
    "Heart Me":       "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/d56945782445b0b8c8658ed44f894c7b~tplv-obj.webp",
    "TikTok":         "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/802a21ae29f9fae5abe3693de9f874bd~tplv-obj.webp",
    "Finger Heart":   "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/a4c4dc437fd3a6632aba149769491f49.png~tplv-obj.webp",
    "Ice Cream Cone": "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/968820bc85e274713c795a6aef3f7c67~tplv-obj.webp",
    "Thumbs Up":      "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/570a663e27bdc460e05556fd1596771a~tplv-obj.webp",
    "Heart":          "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/dd300fd35a757d751301fba862a258f1~tplv-obj.webp",
    "Confetti":       "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/cb4e11b3834e149f08e1cdcc93870b26~tplv-obj.webp",
    "Cake Slice":     "https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/f681afb4be36d8a321eac741d387f1e2~tplv-obj.webp",
  },

  // Coin cost shown in panel (for viewer info)
  giftCoins: {
    "Rose":1, "GG":1, "Heart Me":1, "TikTok":1,
    "Finger Heart":5, "Ice Cream Cone":1, "Thumbs Up":1,
    "Heart":1, "Confetti":100, "Cake Slice":1,
  },
};

// ═══════════════════════════════════════════════════════
//  SVG PLAYER (faces right — natural LTR run direction)
// ═══════════════════════════════════════════════════════
function makePlayerSVG(kitTop, kitShorts, skin) {
  const hair = '#2C1810';
  const o    = 'rgba(0,0,0,0.22)';
  return `<svg class="player-svg" viewBox="0 0 36 60" xmlns="http://www.w3.org/2000/svg">
    <circle cx="18" cy="8" r="6.5" fill="${skin}" stroke="${o}" stroke-width="0.5"/>
    <ellipse cx="18" cy="3.5" rx="5.5" ry="3" fill="${hair}"/>
    <circle cx="15.5" cy="8" r="0.9" fill="#111"/>
    <circle cx="20.5" cy="8" r="0.9" fill="#111"/>
    <rect x="15.5" y="13.5" width="5" height="4" rx="1" fill="${skin}"/>
    <rect x="10" y="16" width="16" height="13" rx="3" fill="${kitTop}" stroke="${o}" stroke-width="0.5"/>
    <text x="18" y="25.5" text-anchor="middle" font-size="5.5" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-weight="bold">10</text>
    <g class="arm-l">
      <rect x="6.5" y="17" width="4.5" height="10" rx="2.2" fill="${kitTop}" stroke="${o}" stroke-width="0.4"/>
      <ellipse cx="8.7" cy="27.5" rx="2.3" ry="2.3" fill="${skin}"/>
    </g>
    <g class="arm-r">
      <rect x="25" y="17" width="4.5" height="10" rx="2.2" fill="${kitTop}" stroke="${o}" stroke-width="0.4"/>
      <ellipse cx="27.3" cy="27.5" rx="2.3" ry="2.3" fill="${skin}"/>
    </g>
    <rect x="11" y="28" width="14" height="9" rx="2" fill="${kitShorts}" stroke="${o}" stroke-width="0.4"/>
    <g class="leg-l">
      <rect x="11" y="36" width="5.5" height="12" rx="2.7" fill="${skin}" stroke="${o}" stroke-width="0.4"/>
      <rect x="10.5" y="44.5" width="6.5" height="5.5" rx="2" fill="#EEEEEE"/>
      <ellipse cx="13.5" cy="51.5" rx="4.8" ry="2.8" fill="#111"/>
    </g>
    <g class="leg-r">
      <rect x="19.5" y="36" width="5.5" height="12" rx="2.7" fill="${skin}" stroke="${o}" stroke-width="0.4"/>
      <rect x="19" y="44.5" width="6.5" height="5.5" rx="2" fill="#EEEEEE"/>
      <ellipse cx="22.5" cy="51.5" rx="4.8" ry="2.8" fill="#111"/>
    </g>
  </svg>`;
}

function makeBallSVG() {
  return `<svg class="ball-svg" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
    <circle cx="9" cy="9" r="8.5" fill="white" stroke="#bbb" stroke-width="0.5"/>
    <polygon points="9,2 11,6 9,8 7,6"          fill="#222"/>
    <polygon points="3,7 6,6 7,9 5,11"           fill="#222"/>
    <polygon points="15,7 12,6 11,9 13,11"        fill="#222"/>
    <polygon points="5,14 7,11 11,11 13,14 9,16"  fill="#222"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let positions  = {};
let scores     = {};
let totalGifts = 0;
let roundNum   = 1;
let gameOver   = false;

// Pitch inside #lanes: player starts at left, runs to right
// left: px from LEFT boundary of #lanes div
const FIELD_START = 44;   // just after the flag pole
const FIELD_END   = 1580; // just before right goal mouth (lanes width ≈ 1920-245-76 = 1599)

// ═══════════════════════════════════════════════════════
//  BUILD GIFT PANEL
// ═══════════════════════════════════════════════════════
function buildGiftPanel() {
  const list = document.getElementById('gift-list');
  list.innerHTML = '';
  CONFIG.teams.forEach(team => {
    const entry = Object.entries(CONFIG.giftMap).find(([,c]) => c === team.name);
    if (!entry) return;
    const [giftName] = entry;
    const imgUrl = CONFIG.giftImages[giftName] || '';
    const coins  = CONFIG.giftCoins[giftName]  || '?';
    const col    = team.kitTop === '#FFFFFF' ? '#aaddaa' : team.kitTop;

    const row = document.createElement('div');
    row.className = 'gift-row';
    row.innerHTML = `
      <img src="https://flagsapi.com/${team.flag}/flat/32.png" class="gift-flag" style="width:28px;height:20px;object-fit:contain;border-radius:2px;">
      <div class="gift-info">
        <div class="gift-country" style="color:${col}">${team.name}</div>
        <div class="gift-name">
          <img class="gift-img" src="${imgUrl}" alt="${giftName}" onerror="this.style.display='none'">
          <span>${giftName}<br><span class="gift-coins">🪙 ${coins} coin${coins>1?'s':''}</span></span>
        </div>
      </div>`;
    list.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════
//  BUILD LANES
// ═══════════════════════════════════════════════════════
function buildLanes() {
  const container = document.getElementById('lanes');
  container.innerHTML = '';

  CONFIG.teams.forEach((team) => {
    positions[team.name] = FIELD_START;
    scores[team.name]    = 0;

    const col = team.kitTop === '#FFFFFF' ? '#aaddaa' : team.kitTop;

    // Watermarks spread across lane (LTR)
    let markersHTML = '<div class="lane-markers">';
    const markerCount = 6;
    for (let m = 0; m < markerCount; m++) {
      const pct = (m + 0.5) / markerCount * 100;
      markersHTML += `<div class="lane-marker" style="left:${pct}%">${team.name} ${team.flag}</div>`;
    }
    markersHTML += '</div>';

    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `
      ${markersHTML}

      <!-- Flag pole at LEFT (start) -->
      <div class="lane-start-flag">
        <span class="sflag"><img src="https://flagsapi.com/${team.flag}/flat/32.png"></span>
        <div class="spole"></div>
      </div>

      <!-- Progress bar -->
      <div class="lane-bar">
        <div class="lane-bar-fill" id="bar-${team.name}" style="background:${col}"></div>
      </div>

      <!-- Ball (slightly ahead of player) -->
      <div class="ball-wrap" id="ball-${team.name}" style="left:${FIELD_START + 38}px">
        ${makeBallSVG()}
      </div>

      <!-- Player -->
      <div class="player-wrap" id="player-${team.name}" style="left:${FIELD_START}px">
        <div class="player-flag">${team.flag}</div>
        ${makePlayerSVG(team.kitTop, team.kitShorts, team.skin)}
      </div>
    `;
    container.appendChild(lane);
  });
}

// ═══════════════════════════════════════════════════════
//  MOVE TEAM  (left → right: increasing `left` value)
// ═══════════════════════════════════════════════════════
function moveTeam(countryName, coins) {
  if (gameOver) return;
  if (positions[countryName] === undefined) return;

  const step = CONFIG.baseStep + Math.min(Math.floor(coins / 4), 80);
  positions[countryName] = Math.min(positions[countryName] + step, FIELD_END);

  const px       = positions[countryName];
  const progress = ((px - FIELD_START) / (FIELD_END - FIELD_START)) * 100;

  const playerEl = document.getElementById(`player-${countryName}`);
  const ballEl   = document.getElementById(`ball-${countryName}`);
  const barEl    = document.getElementById(`bar-${countryName}`);

  if (playerEl) playerEl.style.left = px + 'px';
  if (ballEl)   ballEl.style.left   = (px + 38) + 'px';
  if (barEl)    barEl.style.width   = Math.min(progress, 100) + '%';

  scores[countryName]++;
  if (px >= FIELD_END) triggerWinner(countryName);
}

// ═══════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════
function showToast(msg) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2900);
}

function flashGoal() {
  const el = document.getElementById('goal-flash');
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 300);
}

function spawnConfetti() {
  const cols = ['#FFD700','#FF4444','#44FF88','#4488FF','#FF44FF','#FF9900','#00FFDD'];
  for (let i = 0; i < 90; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'conf';
      el.style.cssText = `left:${Math.random()*1920}px;background:${cols[Math.floor(Math.random()*cols.length)]};animation-duration:${1.4+Math.random()*2.2}s`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 28);
  }
}

function triggerWinner(country) {
  gameOver = true;
  const team = CONFIG.teams.find(t => t.name === country);
  flashGoal(); spawnConfetti();
  setTimeout(() => {
    document.getElementById('w-flag').textContent = team?.flag || '🏅';
    document.getElementById('w-name').textContent = country;
    document.getElementById('winner').classList.add('show');
  }, 550);
}

function newRound() {
  gameOver = false; roundNum++;
  document.getElementById('h-round').textContent = roundNum;
  document.getElementById('winner').classList.remove('show');
  buildLanes();
}

// ═══════════════════════════════════════════════════════
//  TIKTOK LIVE STUDIO — AUTOMATIC GIFT BINDING
//  TikTok Live Studio fires postMessage gift events
//  automatically into any Browser Source while live.
//  No Node.js, no API key, no extra setup needed.
// ═══════════════════════════════════════════════════════
window.addEventListener('message', function(event) {
  try {
    const raw  = event.data;
    const data = typeof raw === 'string' ? JSON.parse(raw) : raw;
    if (!data) return;

    if (data.type === 'gift') {
      const inner    = data.data || data;
      const giftName = inner.giftName || inner.gift_name || '';
      const coins    = inner.diamondCount || inner.coins || 1;
      const sender   = inner.nickname || inner.user_name || 'مشترك';
      const country  = CONFIG.giftMap[giftName];

      if (country) {
        totalGifts++;
        document.getElementById('h-gifts').textContent = totalGifts;
        moveTeam(country, coins);
        flashGoal();
        showToast(`🎁 ${sender} أرسل ${giftName} ← ${country} تتقدم! ⚽`);
      }
    }
  } catch(e) { /* ignore non-JSON */ }
});

// ═══════════════════════════════════════════════════════
//  TEST MODE — Press 1-0 to move teams, R to reset
//  احذف هذا الكود إذا أردت
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  const map = {'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,'9':8,'0':9};
  if (map[e.key] !== undefined) {
    const team = CONFIG.teams[map[e.key]];
    if (!team) return;
    totalGifts++;
    document.getElementById('h-gifts').textContent = totalGifts;
    moveTeam(team.name, 10);
    flashGoal();
    showToast(`🧪 اختبار ← ${team.name} تتقدم! ⚽`);
  }
  if (e.key === 'r' || e.key === 'R') newRound();
});

// ── INIT ──
buildGiftPanel();
buildLanes();
</script>
</body>
</html>
